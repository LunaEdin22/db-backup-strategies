services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://postgres:demo@db:5432/demo
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
